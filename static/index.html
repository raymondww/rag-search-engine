<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Keyword Search Pipeline — Live Visualizer</title>
<style>
  :root {
    --bg: #0e1117;
    --panel: #161b22;
    --border: #2a3138;
    --accent: #4fd1c5;
    --accent2: #f6ad55;
    --text: #e6edf3;
    --dim: #8b949e;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px 0;
  }
  .subtitle {
    color: var(--dim);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .search-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
  }
  input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 14px;
  }
  button {
    background: var(--accent);
    color: #0e1117;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { opacity: 0.9; }

  #pipeline {
    display: flex;
    align-items: flex-start;
    gap: 4px;
    overflow-x: auto;
    padding-bottom: 20px;
  }
  .stage {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    min-width: 190px;
    max-width: 240px;
    flex-shrink: 0;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .stage.show {
    opacity: 1;
    transform: translateY(0);
  }
  .stage h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
    margin: 0 0 10px 0;
  }
  .arrow {
    color: var(--border);
    font-size: 20px;
    align-self: center;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .arrow.show { opacity: 1; }

  .token-str {
    font-family: "SF Mono", Consolas, monospace;
    font-size: 13px;
    background: #0d1117;
    padding: 8px 10px;
    border-radius: 6px;
    word-break: break-word;
    color: var(--text);
  }
  .chip {
    display: inline-block;
    background: #0d1117;
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 5px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12px;
    margin: 2px 3px 2px 0;
  }
  .chip.removed {
    text-decoration: line-through;
    color: var(--danger);
    opacity: 0.6;
  }
  .chip.stem {
    border-color: var(--accent);
    color: var(--accent);
  }
  .stage-note {
    color: var(--dim);
    font-size: 11px;
    margin-top: 8px;
  }

  .lookup-row {
    font-size: 12px;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .lookup-row:last-child { border-bottom: none; }
  .lookup-term {
    color: var(--accent);
    font-family: "SF Mono", Consolas, monospace;
    font-weight: 600;
  }
  .lookup-meta { color: var(--dim); font-size: 11px; margin-top: 2px; }

  .score-doc {
    font-size: 12px;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .score-doc:last-child { border-bottom: none; }
  .score-doc-title { font-weight: 600; margin-bottom: 4px; }
  .score-term-line {
    display: flex;
    justify-content: space-between;
    color: var(--dim);
    font-family: "SF Mono", Consolas, monospace;
    font-size: 11px;
  }
  .score-total {
    margin-top: 4px;
    color: var(--accent2);
    font-weight: 600;
  }

  #results {
    margin-top: 10px;
  }
  .result-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .result-title { font-weight: 600; font-size: 14px; }
  .result-desc { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .result-score {
    font-family: "SF Mono", Consolas, monospace;
    color: var(--accent);
    font-size: 13px;
    flex-shrink: 0;
  }
  #status { color: var(--dim); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
</style>
</head>
<body>

<h1>Keyword Search Pipeline — Live Visualizer</h1>
<div class="subtitle">Watch a query move through preprocessing, index lookup, and BM25 scoring in real time.</div>

<div class="search-bar">
  <input type="text" id="queryInput" placeholder="Try: bear adventure" value="bear adventure">
  <button id="searchBtn">Search</button>
</div>

<div id="status"></div>
<div id="pipeline"></div>
<div id="results"></div>

<script>
const API_BASE = ""; // same origin

function stageEl(title, bodyHtml) {
  const div = document.createElement("div");
  div.className = "stage";
  div.innerHTML = `<h3>${title}</h3>${bodyHtml}`;
  return div;
}

function arrowEl() {
  const div = document.createElement("div");
  div.className = "arrow";
  div.textContent = "→";
  return div;
}

function chips(list, cls) {
  if (!list.length) return `<span class="stage-note">none</span>`;
  return list.map(t => `<span class="chip ${cls||''}">${t}</span>`).join("");
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function reveal(container) {
  await sleep(30);
  container.classList.add("show");
  await sleep(280);
}

async function runSearch() {
  const query = document.getElementById("queryInput").value.trim();
  if (!query) return;

  const pipeline = document.getElementById("pipeline");
  const results = document.getElementById("results");
  const status = document.getElementById("status");
  pipeline.innerHTML = "";
  results.innerHTML = "";
  status.textContent = "Running query through pipeline...";

  let data;
  try {
    const res = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(query)}`);
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    data = await res.json();
  } catch (err) {
    status.textContent = `Error: ${err.message}`;
    return;
  }

  // Stage 1: original
  const s1 = stageEl("1. Query", `<div class="token-str">"${data.original}"</div>`);
  pipeline.appendChild(s1);
  await reveal(s1);

  const a1 = arrowEl(); pipeline.appendChild(a1); await reveal(a1);

  // Stage 2: lowercased
  const s2 = stageEl("2. Lowercase", `<div class="token-str">"${data.lowercased}"</div>`);
  pipeline.appendChild(s2);
  await reveal(s2);

  const a2 = arrowEl(); pipeline.appendChild(a2); await reveal(a2);

  // Stage 3: strip punctuation
  const s3 = stageEl("3. Strip Punctuation", `<div class="token-str">"${data.stripped}"</div>`);
  pipeline.appendChild(s3);
  await reveal(s3);

  const a3 = arrowEl(); pipeline.appendChild(a3); await reveal(a3);

  // Stage 4: tokenize
  const s4 = stageEl("4. Tokenize", chips(data.tokens));
  pipeline.appendChild(s4);
  await reveal(s4);

  const a4 = arrowEl(); pipeline.appendChild(a4); await reveal(a4);

  // Stage 5: remove stopwords (show removed ones struck through)
  const removed = data.tokens.filter(t => !data.no_stopwords.includes(t));
  const s5body = chips(data.no_stopwords) +
    (removed.length ? `<div class="stage-note">removed: ${removed.map(r=>`<span class="chip removed">${r}</span>`).join("")}</div>` : `<div class="stage-note">no stopwords found</div>`);
  const s5 = stageEl("5. Remove Stopwords", s5body);
  pipeline.appendChild(s5);
  await reveal(s5);

  const a5 = arrowEl(); pipeline.appendChild(a5); await reveal(a5);

  // Stage 6: stem
  const s6 = stageEl("6. Stem", chips(data.stemmed, "stem"));
  pipeline.appendChild(s6);
  await reveal(s6);

  const a6 = arrowEl(); pipeline.appendChild(a6); await reveal(a6);

  // Stage 7: index lookup
  const lookupBody = data.term_lookups.map(l => `
    <div class="lookup-row">
      <span class="lookup-term">${l.term}</span>
      <div class="lookup-meta">${l.doc_frequency} doc(s) match · IDF ${l.idf}</div>
    </div>
  `).join("") || `<span class="stage-note">no matches</span>`;
  const s7 = stageEl("7. Index Lookup", lookupBody);
  pipeline.appendChild(s7);
  await reveal(s7);

  const a7 = arrowEl(); pipeline.appendChild(a7); await reveal(a7);

  // Stage 8: score calculation (top 3 docs shown in the pipeline stage)
  const topForBreakdown = data.results.slice(0, 3);
  const scoreBody = topForBreakdown.length ? topForBreakdown.map(r => `
    <div class="score-doc">
      <div class="score-doc-title">${r.title}</div>
      ${r.breakdown.map(b => `
        <div class="score-term-line">
          <span>${b.term} (tf=${b.raw_tf})</span>
          <span>${b.contribution}</span>
        </div>
      `).join("")}
      <div class="score-total">total: ${r.score}</div>
    </div>
  `).join("") : `<span class="stage-note">no scoring — no matches</span>`;
  const s8 = stageEl("8. BM25 Scoring", scoreBody);
  pipeline.appendChild(s8);
  await reveal(s8);

  const a8 = arrowEl(); pipeline.appendChild(a8); await reveal(a8);

  // Stage 9: ranked output (compact pointer stage)
  const s9 = stageEl("9. Ranked Output", `<div class="stage-note">${data.results.length} result(s) sorted by score — see below</div>`);
  pipeline.appendChild(s9);
  await reveal(s9);

  status.textContent = `Done — ${data.results.length} result(s) for "${data.original}"`;

  // Final results list
  if (!data.results.length) {
    results.innerHTML = `<div class="stage-note">No documents matched any term in the index.</div>`;
  } else {
    const maxScore = Math.max(...data.results.map(r => r.score));
    data.results.forEach(r => {
      const pct = maxScore ? Math.round((r.score / maxScore) * 100) : 0;
      const card = document.createElement("div");
      card.className = "result-card";
      card.innerHTML = `
        <div>
          <div class="result-title">${r.title}</div>
          <div class="result-desc">${r.description}</div>
        </div>
        <div class="result-score">score ${r.score}<br><span style="color:var(--dim)">(${pct}% of top)</span></div>
      `;
      results.appendChild(card);
    });
  }
}

document.getElementById("searchBtn").addEventListener("click", runSearch);
document.getElementById("queryInput").addEventListener("keydown", e => {
  if (e.key === "Enter") runSearch();
});

// run once on load
runSearch();
</script>

</body>
</html>
